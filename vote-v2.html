<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vote</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Orbitron',sans-serif;

height:100vh;

overflow:hidden;

background:
radial-gradient(circle at top,#3a3a55 0%,#141421 40%,#08080d 100%);

display:flex;
justify-content:center;
align-items:center;

}

/* Fond lumineux */

body::before{

content:"";

position:absolute;

width:180%;
height:180%;

background:

radial-gradient(circle,#3a3aff22 0%,transparent 20%),

radial-gradient(circle,#ff004422 0%,transparent 18%),

linear-gradient(135deg,transparent 0%,rgba(255,255,255,.03) 50%,transparent 100%);

background-size:
600px 600px,
700px 700px,
100% 100%;

animation:bgMove 30s linear infinite;

opacity:.9;

}

@keyframes bgMove{

0%{

transform:translate(0,0) rotate(0deg);

}

100%{

transform:translate(-250px,-120px) rotate(4deg);

}

}

.panel{

position:relative;

z-index:2;

width:min(900px,92vw);

padding:40px;

border-radius:35px;

background:rgba(20,20,30,.72);

backdrop-filter:blur(16px);

border:2px solid rgba(255,255,255,.08);

box-shadow:

0 0 80px rgba(0,0,0,.7),

0 0 40px rgba(90,90,255,.15);

}

h1{

text-align:center;

font-size:48px;

letter-spacing:6px;

margin-bottom:35px;

color:white;

text-shadow:

0 0 20px #fff,

0 0 40px #4f8cff;

}

.scoreboard{

display:flex;

justify-content:space-around;

gap:30px;

margin-bottom:40px;

}

.score{

flex:1;

background:linear-gradient(180deg,#2d2d39,#15151d);

border-radius:25px;

padding:30px;

text-align:center;

border:1px solid rgba(255,255,255,.08);

box-shadow:
inset 0 0 25px rgba(255,255,255,.05);

}

.label{

font-size:26px;

margin-bottom:18px;

color:#ddd;

}

.number{

font-size:75px;

font-weight:900;

transition:.25s;

}

.blue{

color:#4aa8ff;

text-shadow:

0 0 20px #4aa8ff,

0 0 45px #4aa8ff;

}

.red{

color:#ff4040;

text-shadow:

0 0 20px #ff4040,

0 0 45px #ff4040;

}
/* ===========================
        BOUTONS 3D
=========================== */

.buttons{

display:flex;

justify-content:space-evenly;

gap:40px;

margin-top:10px;

margin-bottom:40px;

}

.voteButton{

width:220px;

height:220px;

border-radius:50%;

border:none;

cursor:pointer;

font-size:95px;

font-weight:900;

color:white;

position:relative;

transition:
transform .12s,
box-shadow .25s,
filter .25s;

box-shadow:
0 18px 0 rgba(0,0,0,.45),
0 25px 50px rgba(0,0,0,.5),
inset 0 8px 12px rgba(255,255,255,.28),
inset 0 -15px 20px rgba(0,0,0,.45);

}

.voteButton::before{

content:"";

position:absolute;

inset:10px;

border-radius:50%;

background:

linear-gradient(
180deg,
rgba(255,255,255,.35),
rgba(255,255,255,0)
);

pointer-events:none;

}

.voteButton:hover{

transform:translateY(-6px) scale(1.04);

}

.voteButton:active{

transform:translateY(10px);

box-shadow:
0 8px 0 rgba(0,0,0,.5),
0 8px 25px rgba(0,0,0,.4);

}

#o{

background:
linear-gradient(
180deg,
#6ec8ff,
#2f8dff
);

box-shadow:

0 18px 0 #004b91,

0 0 30px #2196ff,

0 0 90px rgba(0,140,255,.45),

inset 0 8px 15px rgba(255,255,255,.35),

inset 0 -18px 25px rgba(0,0,0,.45);

}

#x{

background:
linear-gradient(
180deg,
#ff6666,
#d11212
);

box-shadow:

0 18px 0 #7d0000,

0 0 30px #ff3f3f,

0 0 90px rgba(255,40,40,.45),

inset 0 8px 15px rgba(255,255,255,.35),

inset 0 -18px 25px rgba(0,0,0,.45);

}

/* ===========================
      TOTAL
=========================== */

.total{

text-align:center;

font-size:38px;

color:white;

margin-top:20px;

margin-bottom:30px;

letter-spacing:3px;

text-shadow:
0 0 15px white;

}

#total{

color:#ffd54a;

font-size:52px;

}

/* ===========================
 RESET
=========================== */

.reset{

display:block;

margin:auto;

padding:18px 45px;

font-size:24px;

font-family:'Orbitron',sans-serif;

border:none;

border-radius:18px;

cursor:pointer;

background:
linear-gradient(
180deg,
#4d4d4d,
#242424
);

color:white;

transition:.25s;

box-shadow:

0 10px 20px rgba(0,0,0,.45);

}

.reset:hover{

transform:scale(1.05);

filter:brightness(1.15);

}

.reset:active{

transform:translateY(4px);

}

/* ===========================
ANIMATIONS
=========================== */

.pop{

animation:pop .25s;

}

@keyframes pop{

0%{

transform:scale(1);

}

50%{

transform:scale(1.22);

}

100%{

transform:scale(1);

}

}
</style>

</head>

<body>

<div class="panel">

<h1 id="title">VOTE TERMINAL</h1>

<div class="scoreboard">

<div class="score">

<div class="label">
⭕ CONTINUER
</div>

<div class="number blue" id="oCount">
0
</div>

</div>

<div class="score">

<div class="label">
❌ ARRÊTER
</div>

<div class="number red" id="xCount">
0
</div>

</div>

</div>

<div class="buttons">

<button
class="voteButton"
id="o">

O

</button>

<button
class="voteButton"
id="x">

X

</button>

</div>

<div class="total">

TOTAL DES VOTES

<br><br>

<span id="total">

0

</span>

</div>

<button
class="reset"
id="resetButton">

RÉINITIALISER

</button>

</div>

<script>

let oVotes =
Number(localStorage.getItem("oVotes")) || 0;

let xVotes =
Number(localStorage.getItem("xVotes")) || 0;

const oCount =
document.getElementById("oCount");

const xCount =
document.getElementById("xCount");

const total =
document.getElementById("total");

function updateDisplay(){

oCount.textContent = oVotes;

xCount.textContent = xVotes;

total.textContent = oVotes + xVotes;

localStorage.setItem("oVotes",oVotes);

localStorage.setItem("xVotes",xVotes);

oCount.classList.remove("pop");

xCount.classList.remove("pop");

void oCount.offsetWidth;

void xCount.offsetWidth;

oCount.classList.add("pop");

xCount.classList.add("pop");

}

updateDisplay();
document.getElementById("o").addEventListener("click",()=>{

oVotes++;

flashButton("o");

updateDisplay();

});

document.getElementById("x").addEventListener("click",()=>{

xVotes++;

flashButton("x");

updateDisplay();

});

function flashButton(id){

const button=document.getElementById(id);

button.style.filter="brightness(1.7)";

button.style.transform="scale(1.08)";

setTimeout(()=>{

button.style.filter="brightness(1)";

button.style.transform="scale(1)";

},120);

}

document.getElementById("resetButton").addEventListener("click",()=>{

if(confirm("Réinitialiser tous les votes ?")){

oVotes=0;

xVotes=0;

updateDisplay();

}

});

/* ---------- MENU ADMIN (appui long sur le titre) ---------- */

let pressTimer;

const title=document.getElementById("title");

title.addEventListener("touchstart",()=>{

pressTimer=setTimeout(()=>{

alert(
"Mode administrateur\n\nO : "
+oVotes+
"\nX : "
+xVotes+
"\nTotal : "
+(oVotes+xVotes)
);

},1800);

});

title.addEventListener("touchend",()=>{

clearTimeout(pressTimer);

});

title.addEventListener("mousedown",()=>{

pressTimer=setTimeout(()=>{

alert(
"Mode administrateur\n\nO : "
+oVotes+
"\nX : "
+xVotes+
"\nTotal : "
+(oVotes+xVotes)
);

},1800);

});

title.addEventListener("mouseup",()=>{

clearTimeout(pressTimer);

});
l
title.addEventListener("mouseleave",()=>{

clearTimeout(pressTimer);

});

</script>

</body>

</html>
