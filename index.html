<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Squid Game</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    width:90%;
}

h1{
    font-size:3em;
    margin-bottom:40px;
}

.votes{
    display:flex;
    justify-content:space-around;
    margin-bottom:50px;
}

.vote{
    text-align:center;
}

.count{
    font-size:4em;
    margin-bottom:20px;
}

button{
    width:180px;
    height:180px;
    border:none;
    border-radius:50%;
    font-size:80px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

#o{
    background:#00c853;
    color:white;
}

#x{
    background:#d50000;
    color:white;
}

.reset{
    margin-top:30px;
    width:250px;
    height:70px;
    border-radius:15px;
    font-size:28px;
    background:#555;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>Vote</h1>

<div class="votes">

<div class="vote">
<div class="count" id="oCount">0</div>
<button id="o">O</button>
</div>

<div class="vote">
<div class="count" id="xCount">0</div>
<button id="x">X</button>
</div>

</div>

<button class="reset" onclick="resetVotes()">Réinitialiser</button>

</div>

<script>

let oVotes = 0;
let xVotes = 0;

document.getElementById("o").onclick = function(){
    oVotes++;
    document.getElementById("oCount").textContent = oVotes;
}

document.getElementById("x").onclick = function(){
    xVotes++;
    document.getElementById("xCount").textContent = xVotes;
}

function resetVotes(){
    if(confirm("Réinitialiser les votes ?")){
        oVotes = 0;
        xVotes = 0;
        document.getElementById("oCount").textContent = 0;
        document.getElementById("xCount").textContent = 0;
    }
}

</script>

</body>
</html>
